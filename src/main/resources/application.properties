# 应用配置
spring.application.name=zcwl
server.address=0.0.0.0
server.port=8080

# Spring Boot 4.0.1 优化配置
# 启用延迟初始化，提高启动速度
spring.main.lazy-initialization=true

# Tomcat 配置优化
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.connection-timeout=60000
server.tomcat.max-connections=10000
server.tomcat.accept-count=100

# 启用虚拟线程（Java 23 特性）
spring.threads.virtual.enabled=true

# 数据库配置
spring.datasource.url=jdbc:postgresql://young143.top:5432/zcwl
spring.datasource.username=zcwl
spring.datasource.password=DbJhS5Jw8jcXp4CC
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP 连接池配置
# 10 分钟，进一步缩短寿命周期，减少连接失效概率
spring.datasource.hikari.max-lifetime=300000
# 3 秒，快速验证连接
spring.datasource.hikari.validation-timeout=5000
# 5 分钟，比 max-lifetime 短，确保空闲连接及时回收
spring.datasource.hikari.idle-timeout=120000
# 1 分钟
spring.datasource.hikari.leak-detection-threshold=60000
# 空闲时测试连接，确保连接有效性
spring.datasource.hikari.test-while-idle=true
# 测试连接的 SQL
spring.datasource.hikari.connection-test-query=SELECT 1
# 最小空闲连接数
spring.datasource.hikari.minimum-idle=5
# 最大连接数
spring.datasource.hikari.maximum-pool-size=20
# 启用连接保持活动，防止连接被中间件断开
spring.datasource.hikari.keepalive-time=30000

# PostgreSQL 连接参数，延长空闲连接保留时间
# 60 秒
spring.datasource.hikari.data-source-properties.keepalives_idle=60
# 30 秒
spring.datasource.hikari.data-source-properties.keepalives_interval=30
# 5 次尝试
spring.datasource.hikari.data-source-properties.keepalives_count=5

# JPA 配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.mvc.pathmatch.matching-strategy=ant_path_matcher

spring.jpa.open-in-view=false

# JWT 配置
jwt.expire-time=86400000
# JWT 密钥配置，使用固定值
jwt.secret-key=your-secret-key-for-jwt-token-generation-and-validation

# 日志配置
# 日志级别
logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type=TRACE
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
# 确保 AI 相关的日志能被正确输出
logging.level.com.example.zcwl.service.impl.AiChatServiceImpl=DEBUG
# 增加 RestTemplate 相关的日志
logging.level.org.springframework.web.client.RestTemplate=DEBUG
# 增加 HTTP 请求相关的日志
logging.level.org.springframework.http=DEBUG
# 代码生成相关日志
logging.level.com.example.zcwl.service.impl.SimpleFrontendProjectServiceImpl=DEBUG
logging.level.com.example.zcwl.controller.CodeController=DEBUG

# 日志文件配置
logging.file.name=logs/zcwl.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

# 日志格式
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# AI 模型配置
spring.ai.openai.api-key=sk-3abb76dbf3ed53ec38cdee5f1c99cc60418fd77f25b6456753048ed41e9427c1
spring.ai.openai.base-url=https://api.qnaigc.com/v1
spring.ai.openai.chat.options.model=qwen3-coder-480b-a35b-instruct
spring.ai.openai.chat.options.temperature=0.7

# Redis 配置
spring.data.redis.repositories.enabled=false
# 连接超时时间
spring.data.redis.connect-timeout=5000
# 读取超时时间
spring.data.redis.timeout=5000
# Redis 服务器地址
spring.data.redis.host=young143.top
# Redis 服务器端口
spring.data.redis.port=6379
# Redis 密码（默认为空）
spring.data.redis.password=redis_F8zZRD
# Redis 数据库索引
spring.data.redis.database=0
# 连接池配置
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-wait=10000
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
# 关闭 Redis 健康检查
management.health.redis.enabled=false

# 健康检查配置
# Actuator 监控配置
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.enable.http=true
management.metrics.enable.jvm=true
management.metrics.enable.system=true

