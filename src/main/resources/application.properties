# 应用配置
spring.application.name=zcwl
server.address=0.0.0.0
server.port=8080

# 数据库配置
spring.datasource.url=jdbc:postgresql://young143.top:5432/zcwl
spring.datasource.username=zcwl
spring.datasource.password=DbJhS5Jw8jcXp4CC
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP连接池配置
# 10分钟，进一步缩短生命周期，减少连接失效概率
spring.datasource.hikari.max-lifetime=600000
# 3秒，快速验证连接
spring.datasource.hikari.validation-timeout=3000
# 5分钟，比max-lifetime短，确保空闲连接及时回收
spring.datasource.hikari.idle-timeout=300000
# 1分钟
spring.datasource.hikari.leak-detection-threshold=60000
# 空闲时测试连接，确保连接有效性
spring.datasource.hikari.test-while-idle=true
# 借用时测试连接，确保每次使用的都是有效连接
spring.datasource.hikari.test-on-borrow=true
# 归还时测试连接，确保归还的连接仍然有效
spring.datasource.hikari.test-on-return=true
# 测试连接的SQL
spring.datasource.hikari.connection-test-query=SELECT 1
# 最小空闲连接数
spring.datasource.hikari.minimum-idle=5
# 最大连接数
spring.datasource.hikari.maximum-pool-size=20
# 启用连接保持活动，防止连接被中间件断开
spring.datasource.hikari.keepalive-time=300000

# PostgreSQL连接参数，延长空闲连接保留时间
# 60秒
spring.datasource.hikari.data-source-properties.keepalives_idle=60
# 30秒
spring.datasource.hikari.data-source-properties.keepalives_interval=30
# 5次尝试
spring.datasource.hikari.data-source-properties.keepalives_count=5

# JPA配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.mvc.pathmatch.matching-strategy=ant_path_matcher

spring.jpa.open-in-view=false

# JWT配置
jwt.expire-time=86400000

# 日志配置
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type=TRACE
