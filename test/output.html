<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlassTask - 极简待办清单</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="app-container">
  <div id="ambient-bg">
    <div id="orb-1" class="ambient-orb"></div>
    <div id="orb-2" class="ambient-orb"></div>
    <div id="orb-3" class="ambient-orb"></div>
  </div>
  
  <main id="main-interface" class="glass-panel">
    <header id="app-header">
      <h1 id="app-title">GlassTask</h1>
      <p id="date-display"></p>
    </header>
    
    <section id="stats-bar">
      <div id="stat-total" class="stat-item">
        <span id="stat-total-count" class="stat-number">0</span>
        <span class="stat-label">总任务</span>
      </div>
      <div id="stat-active" class="stat-item">
        <span id="stat-active-count" class="stat-number">0</span>
        <span class="stat-label">待完成</span>
      </div>
      <div id="stat-completed" class="stat-item">
        <span id="stat-completed-count" class="stat-number">0</span>
        <span class="stat-label">已完成</span>
      </div>
    </section>
    
    <section id="input-section">
      <form id="todo-form" novalidate>
        <div id="input-wrapper">
          <input 
            type="text" 
            id="todo-input" 
            placeholder="添加新任务..." 
            autocomplete="off"
            aria-label="新任务输入"
          >
          <select id="priority-select" aria-label="优先级选择">
            <option value="low">低优先级</option>
            <option value="medium" selected>中优先级</option>
            <option value="high">高优先级</option>
          </select>
          <button type="submit" id="add-btn" aria-label="添加任务">
            <svg id="add-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
        </div>
      </form>
    </section>
    
    <section id="filter-section">
      <div id="filter-tabs" role="tablist">
        <button id="filter-all" class="filter-btn active" data-filter="all" role="tab" aria-selected="true">全部</button>
        <button id="filter-active" class="filter-btn" data-filter="active" role="tab" aria-selected="false">进行中</button>
        <button id="filter-completed" class="filter-btn" data-filter="completed" role="tab" aria-selected="false">已完成</button>
      </div>
    </section>
    
    <section id="list-section">
      <ul id="todo-list" role="list" aria-label="任务列表">
        <!-- 任务项将通过 JS 动态插入 -->
      </ul>
      <div id="empty-state" class="hidden">
        <svg id="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 11l3 3L22 4"></path>
          <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"></path>
        </svg>
        <p id="empty-message">暂无任务，开始添加吧！</p>
      </div>
    </section>
    
    <footer id="app-footer">
      <button id="clear-completed-btn" class="text-btn hidden">清除已完成</button>
    </footer>
  </main>
</div>

<template id="todo-item-template">
  <li class="todo-item" data-id="">
    <div class="todo-content">
      <label class="checkbox-wrapper">
        <input type="checkbox" class="todo-checkbox" aria-label="标记完成">
        <span class="checkmark"></span>
      </label>
      <div class="todo-text-wrapper">
        <p class="todo-text"></p>
        <span class="todo-priority-badge"></span>
      </div>
    </div>
    <div class="todo-actions">
      <button class="action-btn edit-btn" aria-label="编辑">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"></path>
          <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"></path>
        </svg>
      </button>
      <button class="action-btn delete-btn" aria-label="删除">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"></path>
        </svg>
      </button>
    </div>
  </li>
</template>
</body>
</html>
