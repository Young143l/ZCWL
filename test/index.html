<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>七牛云 AI 助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 20px; color: #333; }
        
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .card h2 { margin-bottom: 15px; color: #333; font-size: 1.2rem; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #555; font-weight: 500; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; }
        textarea { min-height: 80px; resize: vertical; }
        
        .btn { padding: 10px 24px; background: #4a90d9; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
        .btn:hover { background: #357abd; }
        .btn:disabled { background: #ccc; }
        
        .response { margin-top: 15px; padding: 15px; background: #f8f9fa; border-radius: 6px; white-space: pre-wrap; word-wrap: break-word; font-size: 0.9rem; line-height: 1.6; max-height: 400px; overflow-y: auto; }
        .response.error { background: #ffeaea; color: #c00; }
        
        .code-snap { margin-top: 10px; padding: 10px; background: #fff9e6; border-radius: 6px; }
        .code-snap-item { display: flex; gap: 8px; margin-bottom: 8px; }
        .code-snap-item input { flex: 1; padding: 8px; }
        .code-snap-item input[type="number"] { width: 70px; }
        .code-snap-item .remove-btn { padding: 4px 10px; background: #ff4d4f; color: white; border: none; border-radius: 4px; cursor: pointer; }
        
        .api-doc { margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 8px; }
        .api-doc code { display: block; color: #4a90d9; font-family: monospace; margin-bottom: 8px; }
        
        .loading { display: inline-block; width: 16px; height: 16px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌥️ 七牛云 AI 助手</h1>
        
        <!-- 问答 -->
        <div class="card">
            <h2>💬 项目问答</h2>
            <div class="form-group">
                <label>项目名称</label>
                <input type="text" id="project-id" value="todo" placeholder="例如：todo">
            </div>
            <div class="form-group">
                <label>问题</label>
                <textarea id="question" placeholder="例如：这个项目是做什么的？">这个项目是做什么的</textarea>
            </div>
            <button class="btn" onclick="sendQuestion()" id="ask-btn">发送</button>
            <div class="response" id="ask-response" style="display:none;"></div>
        </div>
        
        <!-- 文档 -->
        <div class="card">
            <h2>📄 生成文档</h2>
            <div class="form-group">
                <label>项目名称</label>
                <input type="text" id="doc-project-id" value="todo" placeholder="例如：todo">
            </div>
            <button class="btn" onclick="generateDoc()" id="doc-btn">生成</button>
            <div class="response" id="doc-response" style="display:none;"></div>
        </div>
        
        <!-- 流式问答 -->
        <div class="card">
            <h2>💨 项目问答 (流式输出)</h2>
            <div class="form-group">
                <label>项目名称</label>
                <input type="text" id="stream-project-id" value="todo" placeholder="例如：todo">
            </div>
            <div class="form-group">
                <label>问题</label>
                <textarea id="stream-question" placeholder="例如：这个项目是做什么的？">这个项目是做什么的</textarea>
            </div>
            <button class="btn" onclick="sendStreamQuestion()" id="stream-ask-btn">流式发送</button>
            <div class="response" id="stream-ask-response" style="display:none;"></div>
        </div>
        
        <!-- API 文档 -->
        <div class="card">
            <h2>📚 API</h2>
            <div class="api-doc">
                <code>POST /ask/{id}</code>
                <code>POST /ask/{id}/stream</code>
                <code>GET /doc/{id}</code>
            </div>
        </div>
    </div>

    <script>
        const API = 'http://localhost:8001';
        
        async function sendQuestion() {
            const id = document.getElementById('project-id').value.trim();
            const ask = document.getElementById('question').value.trim();
            if (!id || !ask) return alert('请输入项目名称和问题');
            
            const btn = document.getElementById('ask-btn');
            const res = document.getElementById('ask-response');
            
            btn.disabled = true; btn.innerHTML = '<span class="loading"></span>...';
            res.style.display = 'block'; res.className = 'response'; res.textContent = '';
            
            try {
                const r = await fetch(`${API}/ask/${encodeURIComponent(id)}`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ask, codeSnap: []})
                });
                const d = await r.json();
                res.textContent = d.ans || d.detail || '无响应';
            } catch (e) { res.className = 'response error'; res.textContent = e.message; }
            finally { btn.disabled = false; btn.textContent = '发送'; }
        }
        
        async function generateDoc() {
            const id = document.getElementById('doc-project-id').value.trim();
            if (!id) return alert('请输入项目名称');
            
            const btn = document.getElementById('doc-btn');
            const res = document.getElementById('doc-response');
            
            btn.disabled = true; btn.innerHTML = '<span class="loading"></span>...';
            res.style.display = 'block'; res.className = 'response'; res.textContent = '';
            
            try {
                const r = await fetch(`${API}/doc/${encodeURIComponent(id)}`);
                const d = await r.json();
                res.textContent = d.doc || d.detail || '无响应';
            } catch (e) { res.className = 'response error'; res.textContent = e.message; }
            finally { btn.disabled = false; btn.textContent = '生成'; }
        }
        
        function sendStreamQuestion() {
            const id = document.getElementById('stream-project-id').value.trim();
            const ask = document.getElementById('stream-question').value.trim();
            if (!id || !ask) return alert('请输入项目名称和问题');
            
            const btn = document.getElementById('stream-ask-btn');
            const res = document.getElementById('stream-ask-response');
            
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>生成中...';
            res.style.display = 'block';
            res.className = 'response';
            res.textContent = '';
            
            // 使用 fetch 获取流式响应
            fetch(`${API}/ask/${encodeURIComponent(id)}/stream`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ask, codeSnap: []})
            }).then(response => {
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                
                function read() {
                    reader.read().then(({done, value}) => {
                        if (done) {
                            btn.disabled = false;
                            btn.textContent = '流式发送';
                            return;
                        }
                        
                        const chunk = decoder.decode(value, {stream: true});
                        // 解析 SSE 格式的数据
                        const lines = chunk.split('\n');
                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                try {
                                    const data = JSON.parse(line.slice(6));
                                    if (data.text && data.text.trim()) {
                                        res.textContent += data.text;
                                    }
                                    if (data.error) {
                                        res.className = 'response error';
                                        res.textContent += '\n错误: ' + data.error;
                                    }
                                } catch (e) {
                                    // 忽略解析错误
                                }
                            }
                        }
                        
                        // 滚动到底部
                        res.scrollTop = res.scrollHeight;
                        read();
                    }).catch(err => {
                        res.className = 'response error';
                        res.textContent += '\n读取错误: ' + err.message;
                        btn.disabled = false;
                        btn.textContent = '流式发送';
                    });
                }
                
                read();
            }).catch(e => {
                res.className = 'response error';
                res.textContent = e.message;
                btn.disabled = false;
                btn.textContent = '流式发送';
            });
        }
    </script>
</body>
</html>
